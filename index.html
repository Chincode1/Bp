<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โรงเรียนบ้านเป้าวิทยา</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#fdfcf9;--tx:#111;--mu:#7a7a7a;--bd:#e6e2da;--or:#f09c38;--bl:#66d4fa;--cd:#fff;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--tx:#f3efe8;--mu:#a8a39a;--bd:#2c2822;--cd:#1d1a16}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:400 15px/1.6 Prompt,system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%}
#sp{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#sp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46vh;background:radial-gradient(circle,#fff 40%,transparent 42%) 0 0/20px 20px,linear-gradient(#fff0,var(--or));-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);pointer-events:none}
#sp.o{opacity:0;pointer-events:none}
#sp .lg{width:150px;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#sp .t{animation:up .8s .35s both;text-align:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.bar{width:min(220px,60vw);height:5px;border-radius:5px;background:#f3e6d3;overflow:hidden;margin-top:18px;position:relative;z-index:1}
.bar i{display:block;height:100%;width:0;background:var(--or);border-radius:5px}
.n1{font-size:26px;font-weight:600}.n1 b{color:var(--or);font-weight:600}
.n2{font-size:12px;font-weight:600;letter-spacing:.32em;color:var(--mu)}
header{display:flex;align-items:center;gap:14px;padding:12px 18px 12px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--bd);position:fixed;top:0;left:0;right:0;z-index:50}
#app{padding-top:calc(71px + env(safe-area-inset-top,0px))}
.ql{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}.ql a{border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;font-weight:500}
.nw a{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.nw b{color:var(--or);white-space:nowrap;font-weight:500}
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;text-align:center;margin-top:10px}.ex img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--bd)}.ex b{display:block;font-weight:500}.ex small{color:var(--mu)}
.ac{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.ac img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:var(--bd)}.ac small{color:var(--mu)}
footer{padding:22px 20px calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mu);font-size:13px;white-space:pre-line;border-top:1px solid var(--bd)}
header .lg{width:46px;height:46px;object-fit:contain}
header .sep{width:4px;height:44px;background:#ccc;border-radius:2px}
header .n1{font-size:20px;line-height:1.2}header .n2{font-size:10px}
#mb{margin-left:auto;background:none;border:0;padding:8px;cursor:pointer;color:var(--tx)}
#mb i{display:block;width:26px;height:2.5px;background:currentColor;margin:5px 0;border-radius:2px}
.hero{height:min(78vw,520px);background:linear-gradient(135deg,var(--bl),var(--or)) center/cover}
.sheet{position:relative;margin:-46px auto 0;max-width:760px;background:var(--cd);border-radius:46px 46px 0 0;padding:22px 20px 60px}
.sheet .n2{text-align:center;color:#f3c58a}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 8px}
.card{aspect-ratio:1/.85;border-radius:44px;display:flex;align-items:flex-end;padding:16px;color:#fff;font-weight:600;font-size:18px;background:center/cover;overflow:hidden;line-height:1.25;text-shadow:0 1px 6px #0004}
.blk{margin:18px 0}.blk h2{margin:0;font-size:22px;font-weight:600}.blk p{margin:0;white-space:pre-line}
.blk img,.blk video{display:block;max-width:100%;border-radius:18px}
.blk iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px}
.btn{display:inline-block;background:var(--or);color:#fff;border-radius:14px;padding:10px 20px;font-weight:500}
#dr{position:fixed;inset:0;z-index:100;display:none}#dr.on{display:block}
#dr .bk{position:absolute;inset:0;background:#0007}
#dr .pn{position:absolute;right:0;top:0;bottom:0;width:min(330px,86vw);background:var(--bg);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 30px;overflow:auto;animation:sl .25s}
@keyframes sl{from{transform:translateX(100%)}}
.pn a,.pn summary{display:block;padding:11px 4px;border-bottom:1px solid var(--bd);font-weight:500;cursor:pointer}
.pn details a{padding-left:20px;font-weight:400;color:var(--mu)}
.pn .x{float:right;background:none;border:0;font-size:28px;color:var(--tx);cursor:pointer}
.pn .ad{color:var(--or);font-weight:600}
.ov{position:fixed;inset:0;background:#0008;z-index:300;display:none;place-items:center;padding:16px}.ov.on{display:grid}
.md{background:var(--cd);border-radius:18px;padding:22px;width:min(420px,100%);max-height:86vh;overflow:auto}
input,textarea,select{width:100%;padding:10px 12px;margin:4px 0;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--bg);color:var(--tx)}
input[type=color]{padding:2px;height:40px}input[type=checkbox],input[type=range]{width:auto}
.b{background:var(--tx);color:var(--bg);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
.b.o{background:var(--or);color:#fff}.b.s{background:none;color:var(--tx);border:1px solid var(--bd)}.b.d{background:none;color:#c0392b;border:1px solid #c0392b}.b.m{padding:5px 10px;font-size:13px}
#ad{position:fixed;inset:0;z-index:250;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#ad.on{display:flex}
#ad .hd{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}#ad .hd b{flex:1;font-weight:600}
#tabs{display:flex;gap:6px;overflow:auto;padding:10px 16px;border-bottom:1px solid var(--bd);scrollbar-width:none}
#tabs button{white-space:nowrap}#tabs .on{background:var(--or);color:#fff;border-color:var(--or)}
#bd{flex:1;overflow:auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px));max-width:720px;width:100%;margin:auto}
#bd label{display:block;font-size:12px;color:var(--mu);margin-top:10px}
.it{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.pv{max-height:90px;max-width:100%;border-radius:8px;display:block;margin:6px 0;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0/14px 14px}
.hint{font-size:12px;color:var(--mu)}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:400;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;font-size:14px}
</style></head><body>
